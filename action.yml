name: RTC Reward Action

description: Automatically award RTC tokens when a PR is merged. Add this to any repo to turn it into a bounty platform.

author: wuxiaobinsh-gif

inputs:
  node-url:
    description: RTC node URL
    required: false
    default: https://50.28.86.131
  amount:
    description: RTC amount per merged PR
    required: false
    default: "5"
  wallet-from:
    description: Project wallet name for sending RTC
    required: true
  admin-key:
    description: Admin key for the RTC node
    required: true
  dry-run:
    description: If true, simulate payment without actually sending
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Parse PR for wallet
      id: parse-wallet
      shell: bash
      run: |
        BODY="${{ github.event.pull_request.body }}"
        
        # Try to find wallet in PR body
        WALLET=""
        if echo "$BODY" | grep -qi "rtc-wallet:"; then
          WALLET=$(echo "$BODY" | grep -i "rtc-wallet:" | sed 's/.*rtc-wallet:[[:space:]]*//i' | awk '{print $1}' | tr -d '`')
        elif echo "$BODY" | grep -qi "wallet:"; then
          WALLET=$(echo "$BODY" | grep -i "wallet:" | grep -i "rtc" | sed 's/.*wallet:[[:space:]]*//i' | awk '{print $1}' | tr -d '`')
        fi
        
        if [ -z "$WALLET" ]; then
          echo "No wallet found"
          echo "wallet_found=false" >> $GITHUB_OUTPUT
        else
          echo "Found wallet: $WALLET"
          echo "wallet_found=true" >> $GITHUB_OUTPUT
          echo "contributor_wallet=$WALLET" >> $GITHUB_OUTPUT
        fi

    - name: Check if dry run
      if: inputs.dry-run == 'true'
      run: |
        echo "=== DRY RUN MODE ==="
        echo "Would pay ${{ inputs.amount }} RTC to ${{ github.event.pull_request.user.login }}"
        echo "========================"

    - name: Award RTC
      if: inputs.dry-run != 'true' && steps.parse-wallet.outputs.wallet_found == 'true'
      shell: bash
      env:
        AMOUNT: ${{ inputs.amount }}
      run: |
        WALLET="${{ steps.parse-wallet.outputs.contributor_wallet }}"
        curl -s -X POST "${{ inputs.node-url }}/api/transfer" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ inputs.admin-key }}" \
          -d "{\"to\": \"$WALLET\", \"amount\": $AMOUNT, \"from\": \"${{ inputs.wallet-from }}\", \"memo\": \"PR #${{ github.event.pull_request.number }} merged\"}"

    - name: Post reward comment
      if: inputs.dry-run != 'true' && steps.parse-wallet.outputs.wallet_found == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: `## 🎉 PR Merged — RTC Reward\n\n**Contributor:** @${context.payload.pull_request.user.login}\n**Amount:** ${process.env.AMOUNT} RTC\n**PR:** #${context.payload.pull_request.number}\n**Merged by:** @${context.actor}\n\nYour RTC reward has been processed!`
          })
